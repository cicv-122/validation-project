upstream django_backend {
    server icvc_backend:8000;
}

server {
    listen 80;
    server_name validation.kg;

    # Перенаправляем весь HTTP трафик на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name validation.kg;

    ssl_certificate /etc/letsencrypt/live/validation.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/validation.kg/privkey.pem;

    client_max_body_size 50M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Отдача медиа файлов (кэш 1 день)
    location /media/ {
        alias /var/www/project/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header Vary Accept-Encoding;
    }

    # Отдача статики Django (кэш 1 час)
    location /static/ {
        alias /var/www/project/staticfiles/;
        add_header Cache-Control "public, max-age=3600";
        add_header Vary Accept-Encoding;
    }

    # Отдача собранных скриптов и стилей фронтенда Vite (кэш 1 год — у них хэши в именах)
    location /assets/ {
        alias /var/www/project/staticfiles/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
    }

    # Иконка сайта
    location /vite.svg {
        alias /var/www/project/staticfiles/vite.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # 301 Permanent Redirect со старых языковых путей (/ru/, /ky/, /en/) на плоские URL
    rewrite ^/(ru|ky|en)/(.*)$ /$2 permanent;
    rewrite ^/(ru|ky|en)$ / permanent;

    # Все прочие запросы направляем в Django (он раздает API, админку и корневой index.html React)
    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        # HTML не кэшируем — чтобы пользователи всегда получали свежую страницу
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Запрещаем доступ к скрытым файлам и папкам (.git, .env и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
